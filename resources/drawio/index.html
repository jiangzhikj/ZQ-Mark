	<link rel="stylesheet" media="(forced-colors: active)" href="styles/high-contrast.css" id="high-contrast-stylesheet">
	<script src="js/bootstrap.js"></script>
	<style type="text/css">
		/* ZQ Mark：bundle 就绪前居中加载页，仍用 #geInfo 供上游脚本移除 */
		#geInfo.zq-drawio-boot {
			position: fixed;
			inset: 0;
			z-index: 99999;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			background: #f5f5f5;
			font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			color: #3d3d3d;
			-webkit-font-smoothing: antialiased;
		}
		.zq-drawio-boot__inner {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 28px;
		}
		.zq-drawio-boot__spinner-wrap {
			position: relative;
			width: 64px;
			height: 64px;
		}
		.zq-drawio-boot__orbit {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			border: 3px solid rgba(0, 0, 0, 0.06);
		}
		.zq-drawio-boot__spin {
			position: absolute;
			inset: 0;
			box-sizing: border-box;
			border-radius: 50%;
			border: 3px solid transparent;
			border-top-color: #6e6e6e;
			border-right-color: rgba(80, 80, 80, 0.35);
			animation: zq-drawio-boot-spin 0.95s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
		}
		@keyframes zq-drawio-boot-spin {
			to {
				transform: rotate(360deg);
			}
		}
		.zq-drawio-boot__label {
			font-size: 19px;
			font-weight: 600;
			letter-spacing: 0.02em;
			color: #2a2a2a;
		}
		.zq-drawio-boot__hint {
			font-size: 13px;
			font-weight: 400;
			letter-spacing: 0.04em;
			color: #8a8a8a;
			margin-top: -18px;
		}
		@media (prefers-reduced-motion: reduce) {
			.zq-drawio-boot__spin {
				animation-duration: 1.6s;
				animation-timing-function: linear;
			}
		}
		@media (prefers-color-scheme: dark) {
			#geInfo.zq-drawio-boot {
				background: #2c2c2c;
				color: #e8e8e8;
			}
			.zq-drawio-boot__orbit {
				border-color: rgba(255, 255, 255, 0.08);
			}
			.zq-drawio-boot__spin {
				border-right-color: rgba(200, 200, 200, 0.35);
				border-top-color: #c8c8c8;
			}
			.zq-drawio-boot__label {
				color: #f0f0f0;
			}
			.zq-drawio-boot__hint {
				color: #9a9a9a;
			}
		}
	</style>
</head>
<body class="geEditor geClassic">
<div id="geInfo" class="zq-drawio-boot">
	<div class="zq-drawio-boot__inner">
		<!-- <div class="zq-drawio-boot__spinner-wrap" aria-hidden="true">
			<div class="zq-drawio-boot__orbit"></div>
			<div class="zq-drawio-boot__spin"></div>
		</div> -->
		<span class="zq-drawio-boot__label">Loading…</span>
		<span class="zq-drawio-boot__hint">Diagram editor</span>
	</div>
</div>
<script src="js/main.js"></script>
</body>
